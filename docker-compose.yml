services:
  postgres:
    image: postgres:16-alpine
    container_name: apartment-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: apartment_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apartment-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  backend:
    image: node:20-bookworm
    container_name: apartment-backend
    ports:
      - '4000:4000'
    working_dir: /app/backend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    env_file:
      - backend/.env
    command: sh -c "npm install && npx prisma generate && npx tsx watch src/index.ts"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
